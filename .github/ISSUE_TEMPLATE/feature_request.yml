name: 功能建议 / Feature request
description: 描述需求与使用场景 / Describe a need and its use case
body:
  - type: markdown
    attributes:
      value: |
        请使用虚构示例，不要附带密钥、私人表情、对话或未经脱敏的日志。
        Use synthetic examples. Do not include keys, private expressions, conversations, or unredacted logs.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 当前哪一步无法完成？/ What cannot you accomplish today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式（可选）/ Alternatives tried (optional)
  - type: input
    id: versions
    attributes:
      label: 环境（可选）/ Environment (optional)
      description: Amoji 插件、dsh、Node.js 和操作系统版本 / Amoji plugin, dsh, Node.js, and OS versions
