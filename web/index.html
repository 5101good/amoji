<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Amoji · 表情选择器</title><link rel="stylesheet" href="/panel.css"><script type="module" src="/panel.js"></script></head>
<body>
  <header><span class="wordmark">amoji<span>表情，也是语言。</span></span><span class="badge">接入验证 · 3 个样本</span></header>
  <main>
    <section class="library" aria-labelledby="title">
      <div class="heading"><div><p class="eyebrow">给这一刻，一个表情</p><h1 id="title">不止文字。</h1></div><button id="motion" class="quiet" aria-pressed="false">暂停动图</button></div>
      <p id="connection" role="status">正在关联 Codex 会话…</p>
      <div id="catalog" class="catalog" aria-label="表情列表"></div>
      <section id="preview" class="preview" aria-live="polite"><p>选一个表情，看看它想表达什么。</p></section>
      <div class="actions"><button id="send" disabled>发送到 Codex</button><button id="cancel" class="quiet" disabled>取消选择</button><span id="status" role="status"></span></div>
      <p class="footnote">你看见图像，AI 收到同一版本的固定文字语义。<br>这些是开发样本；此面板尚不提供个人表情库管理。</p>
    </section>
    <aside aria-labelledby="history-title"><div class="aside-heading"><h2 id="history-title">这次交流</h2><span id="session"></span></div><p class="hint">仅显示此插件进程中当前会话的消息。</p><div id="messages"><p class="empty">还没有表情。<br>一点心意，从这里开始。</p></div></aside>
  </main>
</body>
</html>
