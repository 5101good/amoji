name: Current DSH compatibility
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'adapters/dsh/**'
      - 'tests/**'
      - 'scripts/dsh/**'
      - 'scripts/build-dsh-plugin.mjs'
      - 'package*.json'
      - '.github/workflows/dsh-upstream.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, desktop-nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/dsh/check-upstream.mjs ${{ matrix.channel }}
